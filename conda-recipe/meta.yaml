package:
  name: "new-node-hugin"
  version: {{ BUILD_VERSION }}

source:
  git_url: ../

build:
  entry_points:
    - new-node-hugin=hugin.main:main
  script_env:
    - BUILD_VERSION

requirements:
  build:
    - python                                # [build_platform != target_platform]
    - cross-python_{{ target_platform }}    # [build_platform != target_platform]
    - flatc

  host:
    - python
    - setuptools
    - link2-python
    - libflatbuffers

  run:
    - python
    - link2-python
    - libflatbuffers

test:
  commands:
    - "new-node-hugin --help"

extra:
  git-commit: {{ GIT_FULL_HASH }}

about:
  home: "git@github.com:imad-ourabi/new-node-hugin.git"
  license: "MPL-2.0"
  license_file: "LICENSE"
  summary: "experimental node for hugin"
